<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | بيتك للتداول</title>
  <meta name="theme-color" content="#0b0b0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>

<body class="login-page">

  <div class="">

    <!-- Form side -->
    <div class="lg-panel">
      <header class="lg-top">
        <a class="lg-logo" href="index.html">
          <img src="https://www.kfhtrade.com/Frontend/kfh_trade/images/logo.svg" alt="بيتك للتداول">
        </a>
        <div class="lg-top-actions">
          <a class="lg-lang" href="enlogin.html" hreflang="en" lang="en">EN</a>
        </div>
      </header>

      <main class="lg-main">
        <div class="">
          <h1>تسجيل الدخول إلى حسابك</h1>
          <p class="lead">سجّل الدخول لمتابعة الأسواق وفتح صفحة فرز الأسهم.</p>

          <!-- Prototype login: the inputs have no name attribute, so nothing you type is ever sent anywhere.
               Submitting simply opens the screener. Replace with a real sign-in when it exists. -->
          <form action="screener.html" method="get">
            <div class="field">
              <label for="u">اسم المستخدم</label>
              <div class="input">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
                </svg>
                <input id="u" type="text" autocomplete="username" required>
              </div>
            </div>

            <div class="field">
              <label for="p">كلمة السر</label>
              <div class="input has-reveal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="5" y="11" width="14" height="10" rx="2" />
                  <path d="M8 11V8a4 4 0 018 0v3" />
                </svg>
                <input id="p" type="password" autocomplete="current-password" required>
                <button class="reveal" id="reveal" type="button" aria-pressed="false" aria-label="إظهار كلمة السر"
                  data-show="إظهار كلمة السر" data-hide="إخفاء كلمة السر">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="lg-row">
              <label class="switch">
                <input type="checkbox" role="switch">
                <span class="track" aria-hidden="true"></span>
                <span>تذكرني</span>
              </label>
              <a href="https://trading.kfhtrade.com/">هل نسيت كلمة السر؟</a>
            </div>

            <button class="btn btn-white lg-submit" type="submit">تسجيل الدخول</button>
          </form>

          <p class="demo-note">نسخة تجريبية: أي اسم مستخدم وكلمة سر تفتح صفحة فرز الأسهم.</p>

          <p class="lg-alt">
            <span>جديد على بيتك للتداول؟</span>
            <a href="https://www.kfhtrade.com/Account-Opening">فتح حساب جديد</a>
            <a href="https://www.kfhtrade.com/FAQ">أسئلة وأجوبة</a>
          </p>
        </div>
      </main>
      <div class="text-center">
        <footer class="lg-foot">حقوق الطبع والنشر ©2026 شركة بيتك كابيتال للاستثمار. جميع الحقوق محفوظة.</footer>
      </div>

    </div>


  </div>

  <script>
    /* Show / hide password */
    (function () {
      var btn = document.getElementById('reveal'), input = document.getElementById('p');
      btn.addEventListener('click', function () {
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.setAttribute('aria-pressed', String(show));
        btn.setAttribute('aria-label', show ? btn.dataset.hide : btn.dataset.show);
      });
    })();
  </script>
</body>

</html>
